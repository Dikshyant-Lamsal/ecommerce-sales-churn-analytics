services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_dw}
      POSTGRES_USER: ${DB_USER:-etl_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-etl_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-etl_user} -d ${DB_NAME:-ecommerce_dw}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: python:3.11-slim
    working_dir: /mlflow
    command: >-
      sh -c "pip install --no-cache-dir 'mlflow>=2.13,<4' &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
      --allowed-hosts 'localhost:*,127.0.0.1:*,host.docker.internal:5000,mlflow:5000'"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: EcommerceChurnClassifier
      MODEL_URI: models:/EcommerceChurnClassifier@champion
      LOCAL_MODEL_PATH: artifacts/churn_model.joblib
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts:ro

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      CHURN_API_URL: http://api:8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecommerce_dw}
      DB_USER: ${DB_USER:-etl_user}
      DB_PASSWORD: ${DB_PASSWORD:-etl_pass}
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-ecommerce_dw}
      DB_USER: ${DB_USER:-etl_user}
      DB_PASSWORD: ${DB_PASSWORD:-etl_pass}
      PGPASSWORD: ${DB_PASSWORD:-etl_pass}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - airflow_data:/opt/airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_data:
